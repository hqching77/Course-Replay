[project]
name = "course-replay-backend"
version = "0.1.0"
description = "Course Replay FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "PyMuPDF>=1.24.0",
  "python-pptx>=1.0.2",
  "openai>=1.55.0",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
