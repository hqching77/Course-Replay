name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Site is served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional: set a repository variable API_BASE (e.g. https://your-backend.example.com)
          # to connect the hosted frontend to a deployed FastAPI backend.
          VITE_API_BASE: ${{ vars.API_BASE }}

      # Single-page-app fallback: deep links like /courses/123 load the app instead of a GitHub 404.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
