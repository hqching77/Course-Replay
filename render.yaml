# Render Blueprint for the Course Replay API (free plan). See DEPLOY.md.
# Render → New → Blueprint → choose this repo. Render asks you for every `sync: false`
# value; those secrets are stored on Render only and never go into git.
services:
  - type: web
    name: course-replay-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: production
      # 32 random bytes, base64 — encrypts notes/transcripts in the database. Keep a copy!
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Neon (or any Postgres) connection string. Render's own disk is wiped on every restart.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://hqching77.github.io
      # Render sits behind Cloudflare, which sets this header to the visitor's real address.
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      # Server-side AI (optional: users can also enter their own key in 设置).
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: OPENAI_VISION_MODEL
        sync: false
      # Speech-to-text for 上课中 (SiliconFlow SenseVoiceSmall by default).
      - key: STT_API_KEY
        sync: false
